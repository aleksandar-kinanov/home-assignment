{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}-grafana-datasource
  labels:
    {{- include "app.componentLabels" (dict "ctx" . "component" "grafana") | nindent 4 }}
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "app.fullname" . }}-prometheus.{{ .Release.Namespace }}.svc.cluster.local:9090
        isDefault: true
{{- end }}
