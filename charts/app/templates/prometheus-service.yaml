{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}-prometheus
  labels:
    {{- include "app.componentLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
spec:
  type: NodePort
  ports:
    - port: 9090
      targetPort: http
      protocol: TCP
      name: http
      nodePort: {{ .Values.monitoring.prometheus.service.nodePort }}
  selector:
    {{- include "app.componentSelectorLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
{{- end }}
