{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}-grafana-dashboard
  labels:
    {{- include "app.componentLabels" (dict "ctx" . "component" "grafana") | nindent 4 }}
data:
  app-dashboard.json: |
    {{- .Files.Get "dashboards/app-dashboard.json" | nindent 4 }}
{{- end }}
