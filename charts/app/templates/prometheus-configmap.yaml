{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}-prometheus-config
  labels:
    {{- include "app.componentLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s

    scrape_configs:
      - job_name: app
        metrics_path: /metrics
        static_configs:
          - targets:
              - "{{ include "app.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"

      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
{{- end }}
