name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      app_changed: ${{ steps.check.outputs.app_changed }}
      charts_changed: ${{ steps.check.outputs.charts_changed }}
    steps:
      - name: Check changed paths
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')

          app_changed=$(echo "$files" | grep -c '^app/' || true)
          if [ "$app_changed" -gt 0 ]; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes under app/ in this PR."
          fi

          charts_changed=$(echo "$files" | grep -c '^charts/' || true)
          if [ "$charts_changed" -gt 0 ]; then
            echo "charts_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "charts_changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes under charts/ in this PR."
          fi

  test-lint:
    name: Test & Lint
    needs: changes
    if: needs.changes.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      # Deliberately the PR head SHA, not the default merge commit: the image
      # in build-and-push is built from this same SHA, so tests run against
      # byte-for-byte what ships.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

  helm-lint:
    name: Helm Lint
    needs: changes
    if: needs.changes.outputs.charts_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - run: helm lint charts/app

  build-and-push:
    name: Build & Push Image
    needs: [changes, test-lint]
    if: needs.changes.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compute short SHA
        id: sha
        run: echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
        env:
          SHA: ${{ github.event.pull_request.head.sha }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.sha.outputs.short }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate SBOM (CycloneDX via Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cyclonedx.json

  promote:
    name: Promote merged image to a release version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: read
    concurrency:
      group: promote-release
      cancel-in-progress: false
    steps:
      - name: Resolve merged PR's head SHA
        id: pr
        run: |
          pr_json=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            -H "Accept: application/vnd.github+json")
          head_sha=$(echo "$pr_json" | jq -r '.[0].head.sha')
          number=$(echo "$pr_json" | jq -r '.[0].number')
          if [ -z "$head_sha" ] || [ "$head_sha" = "null" ]; then
            echo "No merged PR found for commit ${{ github.sha }} — this workflow expects merges to main to go through a PR (so build-and-push already built/attested the image)." >&2
            exit 1
          fi
          echo "short=${head_sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the merged PR touched app/
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/files" \
            --paginate --jq '.[].filename')

          changed=$(echo "$files" | grep -c '^app/' || true)
          if [ "$changed" -gt 0 ]; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
            echo "Merged PR #${{ steps.pr.outputs.number }} didn't touch app/ — no new image was built, nothing to promote."
          fi

      - uses: actions/checkout@v4
        if: steps.changes.outputs.app_changed == 'true'
        with:
          fetch-depth: 0

      - name: Compute next release version
        id: version
        if: steps.changes.outputs.app_changed == 'true'
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.app_changed == 'true'
      - uses: docker/login-action@v3
        if: steps.changes.outputs.app_changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the PR-built image exists
        if: steps.changes.outputs.app_changed == 'true'
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository }}:${{ steps.pr.outputs.short }} >/dev/null

      - name: Tag already-built image with release version
        if: steps.changes.outputs.app_changed == 'true'
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }} \
            ghcr.io/${{ github.repository }}:${{ steps.pr.outputs.short }}

      - name: Create and push release tag
        if: steps.changes.outputs.app_changed == 'true'
        run: |
          git tag ${{ steps.version.outputs.version }} ${{ github.sha }}
          git push origin ${{ steps.version.outputs.version }}
